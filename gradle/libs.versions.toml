androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
baserecyclerviewadapterhelper = { module = "com.github.CymChad:BaseRecyclerViewAdapterHelper", version.ref = "baserecyclerviewadapterhelperVersion" }
checkversionlib = { module = "com.github.jikun2008:CheckVersionLib", version.ref = "checkversionlibVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
