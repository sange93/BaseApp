[versions]
accompanistVersion = "0.37.3"
activityCompose = "1.9.0"
agp = "9.2.0"
baserecyclerviewadapterhelperVersion = "3.0.6"
checkversionlibVersion = "2.5.0"
coreSplashscreenVersion = "1.2.0-beta02"
coroutines = "1.10.2"
kotlin = "2.3.21"
#ksp = "2.0.21-1.0.28"
coreKtx = "1.16.0"
junit = "4.13.2"
